---
# Teardown tasks - imported by chromium.yml and teardown.yml
# Expects variables: ec2_instance_ids (optional), aws_region

- name: Terminating EC2 Instances by ID
  amazon.aws.ec2_instance:
    wait: yes
    state: absent
    instance_ids: "{{ ec2_instance_ids }}"
    region: "{{ aws_region }}"
  when: ec2_instance_ids is defined and ec2_instance_ids | length > 0
  ignore_errors: yes

- name: Terminating EC2 Instances by tag (fallback)
  amazon.aws.ec2_instance:
    state: absent
    region: "{{ aws_region }}"
    filters:
      "tag:Name": Chromium
      instance-state-name:
        - running
        - stopped
        - pending
  ignore_errors: yes

- name: Deleting Security Group
  amazon.aws.ec2_group:
    name: Chromium
    state: absent
    region: "{{ aws_region }}"
  ignore_errors: yes

- name: Deleting EC2 Key Pair
  amazon.aws.ec2_key:
    name: ansible
    state: absent
    region: "{{ aws_region }}"
  ignore_errors: yes

- name: Deleting SSH Key
  file:
    path: "../{{ item }}"
    state: absent
  with_items:
    - ansible.pem
    - ansible.pem.pub
  ignore_errors: yes
